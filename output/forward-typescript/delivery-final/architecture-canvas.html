function showModule(m){if(!m)return;selected={type:'node',id:m.path||m.id};highlight();const path=m.path||m.id,syms=m.symbols||m.functions||[],inc=allEdges.filter(e=>e.to===path),out=allEdges.filter(e=>e.from===path),rs=refsOf(m).length?refsOf(m):[{path,line:1}],risks=findings.filter(f=>refsOf(f).some(r=>r.path===path));setDetail(`<div class="detail-type">模块下钻 · ${esc(categoryNames[m.category]||m.category||'源码')}</div><h2>${esc(path)}</h2><p class="description">${esc(m.doc||m.description||'职责请结合符号定义、静态引用与业务视图判断；不从文件名臆测。')}</p><p class="dim-note">${m.analysis_status==='reviewed'?'已审查':'仅索引，职责/风险尚未逐项审查'} · ${m.lines??'?'} 行 · SHA-256 ${esc((m.sha256||'未记录').slice(0,16))}${m.sha256?'…':''}</p><h3>文件依据</h3>${refsHtml(rs)}${m.index_limit?'<p class="dim-note">'+esc(m.index_limit)+'</p>':''}<h3>内部符号 ${syms.length}</h3><input id="symbolSearch" class="search" aria-label="搜索内部函数或类" placeholder="搜索函数 / 类 / 路由处理函数"><div id="symbolList"></div>${(m.tables||[]).length?'<h3>静态检出的数据表</h3><p class="dim-note">'+esc(m.tables.join(' · '))+'</p>':''}<h3>未解析为本仓库文件的导入</h3><p class="dim-note">含标准库、第三方包及动态定位未解析项；不等于导入失败，也不能猜测运行时目标。</p><div id="unresolvedImports"></div><h3>被谁引用 · ${inc.length} 条</h3><div id="incomingList"></div><h3>引用谁 · ${out.length} 条</h3><div id="outgoingList"></div>${risks.length?'<h3>涉及此文件的风险</h3>'+riskCards(risks):''}`);bindRefs(rs);bindRisks();const renderSyms=()=>{const q=$('symbolSearch').value.toLowerCase();$('symbolList').innerHTML=syms.map((s,i)=>({s,i})).filter(({s})=>(s.name||'').toLowerCase().includes(q)).map(({s,i})=>`<button class="symbol" data-symbol="${i}"><code>${esc(s.name||s.symbol||s.id)}</code><small>${esc(s.kind||'定义')} · L${s.line}–${s.end||s.line} · ${(s.calls||[]).length} 处原始调用表达式</small></button>`).join('')||'<p class="empty">没有可展示的内部定义；配置/HTML非Python结构不应臆造类与函数。</p>';$('symbolList').querySelectorAll('[data-symbol]').forEach(b=>b.onclick=()=>showSymbol(m,syms[Number(b.dataset.symbol)]));};$('symbolSearch').oninput=renderSyms;renderSyms();const unresolved=(m.imports||[]).filter(im=>!im.targets?.length);$('unresolvedImports').innerHTML=unresolved.map((im,i)=>`<button class="call-btn" data-unresolved="${i}"><code>${esc(im.statement)}</code><small class="dim-note" style="display:block;margin:0">外部包 / 动态定位未解析 · ${esc(im.scope||'模块级')}</small></button>`).join('')||'<p class="dim-note">未检出此类导入。</p>';$('unresolvedImports').querySelectorAll('[data-unresolved]').forEach(b=>b.onclick=()=>{const r=refsOf(unresolved[Number(b.dataset.unresolved)])[0];if(r)showRef(r);});[['incomingList',inc,'from'],['outgoingList',out,'to']].forEach(([id,edges,key])=>{$(id).innerHTML=edges.map((e,i)=>`<div class="outgoing"><button class="route" data-rel="${i}">${esc(e[key])}<small class="dim-note" style="display:block;margin:0">${esc(e.label||e.kind)} · ${esc(refsOf(e)[0]?refText(refsOf(e)[0]):'待确认')}</small></button>${modMap.has(e[key])?`<button class="step" data-rel-module="${i}">下钻</button>`:''}</div>`).join('')||'<p class="dim-note">本次静态扫描未检出。</p>';$(id).querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>showStaticEdge(edges[Number(b.dataset.rel)],m));$(id).querySelectorAll('[data-rel-module]').forEach(b=>b.onclick=()=>routeTo({type:'module',id:edges[Number(b.dataset.relModule)][key]}));});}
function showStaticEdge(e,m){const rs=refsOf(e);setDetail(`<div class="detail-type">源码静态引用</div><h2>${esc(e.label||e.kind||'引用')}</h2><p class="dim-note">${esc(e.from)} → ${esc(e.to)}</p><p class="description">${esc(e.detail||'该引用由源码静态扫描检出，不等于运行时调用。')}</p><div class="detail-actions"><button id="backModule">返回模块</button>${modMap.has(e.to)?'<button id="targetModule">下钻目标模块</button>':''}</div><h3>引用依据</h3>${refsHtml(rs)}`);bindRefs(rs);$('backModule').onclick=()=>showModule(m);if($('targetModule'))$('targetModule').onclick=()=>routeTo({type:'module',id:e.to});}
function showSymbol(m,s){const path=m.path||m.id,calls=s.calls||[],rs=refsOf(s).length?refsOf(s):[{path,line:s.line||1,end:s.end||s.line||1,symbol:s.name}];setDetail(`<div class="detail-type">函数 / 类内部 · 源码事实</div><h2>${esc(s.name||s.id)}</h2><p class="dim-note">${esc(path)} · ${esc(s.kind||'定义')} · L${s.line}–${s.end||s.line}</p><p class="description">${esc(s.doc||'此定义未提供docstring；以下直接展示源码和调用表达式。')}</p><div class="detail-actions"><button id="symbolBack">← 返回模块函数列表</button><button id="fullSymbol">查看定义证据片段</button></div><h3>定义位置</h3>${refsHtml(rs)}<h3>内部原始调用表达式 ${calls.length}</h3><p class="dim-note">这里只报告源码中出现的表达式。不把对象方法、回调、别名或动态分派猜成一个具体运行时目标。</p><div id="calls">${calls.map((c,i)=>`<button class="call-btn" data-call="${i}"><code>${esc(c.text||c.expression||c.name||'调用')}</code><small class="dim-note" style="display:block;margin:0">${esc(refsOf(c)[0]?refText(refsOf(c)[0]):'定位待确认')}</small></button>`).join('')||'<p class="dim-note">未检出调用表达式。</p>'}</div>`);bindRefs(rs);$('symbolBack').onclick=()=>showModule(m);$('fullSymbol').onclick=()=>showRef({path,line:s.line||1,end:s.end||s.line||1,symbol:s.name},80);$('calls').querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>{const r=refsOf(calls[Number(b.dataset.call)])[0];if(r)showRef(r);else toast('此表达式的代码位置待确认');});}
function showFinding(f){if(!f)return;const rs=refsOf(f);setDetail(`<div class="detail-type">架构评审 · ${esc(f.id)}</div><div class="badge-row"><span class="badge risk">${esc(f.severity||'待评估')}</span></div><h2>${esc(f.title)}</h2><h3>已确认事实</h3><p class="description">${esc(f.fact||f.detail||'')}</p><h3>影响与边界</h3><p class="description">${esc(f.impact||'待确认')}</p><h3>建议</h3><p class="description">${esc(f.recommendation||'待确认')}</p><h3>代码依据</h3>${refsHtml(rs)}`);bindRefs(rs);}
function showQuestion(q){const rs=refsOf(q);setDetail(`<div class="detail-type">待确认 · ${esc(q.id)}</div><h2>${esc(q.question||q.title)}</h2><p class="description">${esc(q.why||q.detail||'')}</p><h3>为什么提出此问题</h3>${refsHtml(rs)}<p class="dim-note">问题未获答案前保持待确认；不会自动把假设当成架构事实。</p>`);bindRefs(rs);}
function showListPage(type){$('stage').style.display='none';$('contentPanel').classList.add('active');$('traceBar').style.display='none';$('fitBtn').disabled=true;$('zoomIn').disabled=true;$('zoomOut').disabled=true;renderNav();const panel=$('contentPanel');
 if(type==='risks'){$('viewTitle').textContent='风险与坏味道';$('viewMeta').textContent=`${findings.length} 项评审发现`;$('viewNote').textContent='事实、影响、建议分开。风险等级表达处置优先级，不表示已发生事故。';panel.innerHTML=findings.map(f=>`<article class="list-card"><div class="badge-row"><span class="badge risk">${esc(f.severity||'待评估')}</span><span class="badge">${esc(f.id)}</span></div><h3>${esc(f.title)}</h3><p>${esc(f.fact||f.detail||'')}</p><button data-list-risk="${esc(f.id)}">查看影响、建议与证据 →</button></article>`).join('');panel.querySelectorAll('[data-list-risk]').forEach(b=>b.onclick=()=>showFinding(findings.find(f=>f.id===b.dataset.listRisk)));setDetail('<div class="detail-type">架构评审</div><h2>选择一项发现</h2><p class="description">每项保留代码依据及建议。代码未能证明的现场情况不会以确定事实呈现。</p>');}
 else if(type==='questions'){$('viewTitle').textContent='待确认问题';$('viewMeta').textContent=`${questions.length} 项待确认`;$('viewNote').textContent='只列需要人或现场信息才能定论的事项；已确认业务口径不重复询问。';panel.innerHTML=questions.map(q=>`<article class="list-card"><span class="badge unknown">${esc(q.id)}</span><h3>${esc(q.question||q.title)}</h3><p>${esc(q.why||q.detail||'')}</p><button data-question="${esc(q.id)}">查看提出依据 →</button></article>`).join('');panel.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>showQuestion(questions.find(q=>q.id===b.dataset.question)));setDetail('<div class="detail-type">待确认</div><h2>未知保持未知</h2><p class="description">此列表用于冻结下一轮工作边界，不代表已授权修改或发布。</p>');}
 else{const lim=DATA.meta?.limitations||DATA.limitations||[];$('viewTitle').textContent='证据范围与使用说明';$('viewMeta').textContent='离线单文件 · 无网络依赖';$('viewNote').textContent='嵌入的源码仅作为文本展示，画布不会执行应用源码、访问外部接口或修改项目。';panel.innerHTML=`<article class="list-card"><h3>这张画布能证明什么</h3><p>业务视图中的节点和边由人工源码审查整理；模块引用图来自静态扫描。点击依据可查看内嵌的带行号源码。现场快照只代表记录时刻，不能替代长期稳定性或真实业务验收。</p><p>代码基线：<code>${esc(DATA.meta?.commit||DATA.commit||'未记录')}</code><br>采集时间：${esc(observedTime())}<br>内容快照：${esc(DATA.meta?.snapshotId)}<br>Git状态：${DATA.meta?.dirty?'含未提交修改':'见快照'}</p></article><article class="list-card"><h3>交互方式</h3><p>拖拽空白区域平移，滚轮或工具栏缩放，“适应”显示完整视图。点击节点或连线查看证据；双击节点下钻模块；模块页可查看所有内部符号与原始调用表达式。</p><p>在节点点“从这里追踪”，随后沿出边“跟随”；底部可回上一步。左上角返回按钮回到先前的业务/模块视图。小屏用“目录”和“证据”按钮打开侧栏。</p></article><article class="list-card"><h3>扫描边界与限制</h3><ul class="limits">${(Array.isArray(lim)?lim:[String(lim)]).map(x=>'<li>'+esc(typeof x==='string'?x:JSON.stringify(x))+'</li>').join('')}</ul><p>索引与审查分开计数：已索引 ${DATA.meta?.coverage?.indexed??mods.length}、已审查 ${DATA.meta?.coverage?.reviewed??0}、排除项 ${DATA.meta?.coverage?.excluded??0}。</p><details><summary>查看排除范围</summary><ul class="limits">${(DATA.excluded||[]).map(x=>'<li>'+esc(x.path)+' · '+esc(x.reason)+'</li>').join('')}</ul></details><p>模块数量：${mods.length}；静态引用边：${allEdges.length}。未检出引用并不证明模块完全无依赖；动态调用的实际目标保持待确认。</p></article>`;setDetail('<div class="detail-type">事实分层</div><h2>源码 / 现场 / 未知 / 过期</h2><p class="description">源码事实：可定位的定义、调用、配置和持久化行为。\n\n现场快照：有采样时间与证据的部署观察。\n\n待确认：需要真实调用方、业务裁决、性能采样或外部契约的信息。</p>');}}
$('focusBtn').onclick=()=>{const on=document.body.classList.toggle('canvas-focus');$('focusBtn').textContent=on?'返回侧栏':'宽幅';requestAnimationFrame(fit);};
$('backBtn').onclick=()=>{const last=history.pop();if(last)routeTo(last,false);};$('moduleSearch').oninput=renderModules;$('category').onchange=renderModules;$('risksBtn').onclick=()=>routeTo({type:'risks'});$('questionsBtn').onclick=()=>routeTo({type:'questions'});$('aboutBtn').onclick=()=>routeTo({type:'about'});$('fitBtn').onclick=fit;$('zoomIn').onclick=()=>zoom(1.2);$('zoomOut').onclick=()=>zoom(1/1.2);$('navToggle').onclick=()=>{$('sidebar').classList.toggle('open');$('detail').classList.remove('open');};$('detailToggle').onclick=()=>{$('detail').classList.toggle('open');$('sidebar').classList.remove('open');};
$('graph').addEventListener('wheel',e=>{e.preventDefault();const r=$('graph').getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
$('graph').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.node,.edge'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,tx:transform.x,ty:transform.y,moved:false};$('graph').setPointerCapture(e.pointerId);$('graph').classList.add('dragging');});$('graph').addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved||=Math.abs(dx)+Math.abs(dy)>5;transform.x=drag.tx+dx;transform.y=drag.ty+dy;applyTransform();});function endDrag(e){if(!drag||drag.id!==e.pointerId)return;const moved=drag.moved;drag=null;$('graph').classList.remove('dragging');if(!moved){if(current?.type==='module')showModule(modMap.get(current.id));else showViewInfo();}}$('graph').addEventListener('pointerup',endDrag);$('graph').addEventListener('pointercancel',()=>{drag=null;$('graph').classList.remove('dragging');});window.addEventListener('resize',()=>{if(innerWidth>940){$('sidebar').classList.remove('open');$('detail').classList.remove('open');}fit();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('sidebar').classList.remove('open');$('detail').classList.remove('open');}});
$('projectTitle').textContent=DATA.meta?.title||'架构剖析';document.title=($('projectTitle').textContent)+' · 交互画布';$('runtimeBadge').textContent=DATA.meta?.runtimeStatus||'未核验运行现场';$('commit').textContent=String(DATA.meta?.snapshotId||'未记录').slice(0,12)+' · '+(DATA.meta?.review?.status==='reviewed'?'已审查声明':'待审草稿');$('observedAt').textContent=observedTime();$('riskCount').textContent=findings.length;$('questionCount').textContent=questions.length;[...new Set(mods.map(m=>m.category).filter(Boolean))].sort().forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=categoryNames[c]||c;$('category').append(o);});
window.ARCH_AUDIT={getState:()=>({route:current,view:view?.id,selection:selected,trace:[...trace],traceEdges:[...traceEdges],transform:{...transform},visibleNodes:view?.nodes.length||0,visibleEdges:view?.edges.length||0}),goView:id=>routeTo({type:'view',id}),goModule:id=>routeTo({type:'module',id}),fit};
if(views.length)routeTo({type:'view',id:views[0].id},false);else routeTo({type:'about'},false);
